# effectcraft 的打包配置。改完只需重新触发 build-effectcraft 或等待每日更新检查。
name: EffectCraft
repo: storytold/effectcraft
appid: ai.storyteller.effectcraft
slug: effectcraft
homepage: https://getartcraft.com/apps/effectcraft
section: graphics
features: []
extra_deps: [libasound2-dev]
permissions:
  audio_record: true
description: |
  开源原生动态图形与视觉特效合成器（deepin 重打包）
